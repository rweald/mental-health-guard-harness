# The basic tooling checks from CLAUDE.md / README: a locked `uv sync`, `ruff check`,
# and the full pytest suite. Everything here is CPU-only and network-free — no vendor
# API calls, no GPU, no prompt files (tests supply their own synthetic fixtures).
#
# Spend control for fork PRs lives in repo settings, not in this file. Settings →
# Actions → General → "Fork pull request workflows from outside collaborators" must be
# set to **Require approval for all external contributors**. That holds every PR from
# someone without write access until a maintainer clicks "Approve and run", so a
# drive-by bot PR never allocates a runner. The weaker default only gates first-time
# contributors, which a bot clears by opening a second PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv is configured `python-preference = "only-system"` / `python-downloads =
      # "never"`, so the interpreter has to be on PATH before `uv sync` runs. Reading
      # `.python-version` keeps CI on the exact patch release asdf pins locally.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` fails rather than resolving, so a pyproject edit that was never
      # relocked is a CI failure instead of a silent difference from local runs.
      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
